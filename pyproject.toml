#:tombi schema.strict = false

[project]
name = "wolfharness"
version = "4.0.0"
description = "Pydantic-AI based Multi-Agent Framework with YAML-based Agents, Teams, Workflows & Extended ACP / AGUI integration"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Philipp Temminghoff", email = "philipptemminghoff@googlemail.com" },
]
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Internet",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "ag-ui-protocol>=0.1.10",
  "alembic>=1.16.5",
  "anyenv[httpx]>=0.3.0",
  "anyio>=4.0",
  # "clawd-code-sdk@git+https://github.com/phil65/claude-agent-sdk-python.git@efbaa798",
  "docler>=1.0.3",
  "docstring-parser>=0.17.0",
  "epregistry",
  "evented>=1.0.5",
  "exxec>=0.1.0",
  "fastapi",
  "fastmcp>=2.12.4",
  "filelock>=3.13",
  "fsspec",
  "httpx",
  "jinja2",
  "jinjarope",
  "keyring>=25.6.0",
  "logfire[fastapi]",
  "mcp>=1.2.0",
  "pillow>=11.3.0",
  "platformdirs",
  "promptantic>=0.4.5",
  "psygnal>=0.11.1",
  "py-key-value-aio[disk]",
  "pydantic>=2.10.0",
  "pydantic-ai-slim[openai,google,anthropic,mistral,retries]>=2.12.0",
  "pydantic-graph>=2.12.0",
  "pydantic-xml>=2.6.0",
  # Only add below (Copier)
  "pydocket>=0.16.1",
  "python-dotenv>=1.0.1",
  "rich",
  "ripgrep-rs>=0.3.0",  # Supports free-threaded Python 3.13+ (Linux only for now)
  "schemez[codegen]",
  # "schemez @ file:///home/phil65/dev/oss/schemez",
  "searchly[all]>=2.0.1",
  "slashed>=0.1.0",
  "sqlalchemy[aiosqlite]",
  "sqlmodel>=0.0.22",
  "starlette>=0.40",
  "structlog>=25.5.0",
  "sublime-search>=0.3.1",
  "tokonomics>=0.1.2",
  "toprompt>=0.0.1",
  "typer",
  "upathtools[httpx]>=0.1.0",
  "uvicorn[standard]",
  "watchfiles>=1.1.1",
  "websockets>=15.0",
  "yamling>=2.0.2",
]

[project.urls]
"Code coverage" = "https://app.codecov.io/gh/Leoyzen/wolfharness"
Discussions = "https://github.com/Leoyzen/wolfharness/discussions"
Documentation = "https://leoyzen.github.io/wolfharness/"
Issues = "https://github.com/Leoyzen/wolfharness/issues"
Source = "https://github.com/Leoyzen/wolfharness"

[project.scripts]
acp-bridge = "acp.bridge.__main__:main"
agentpool = "wolfharness_cli.__main__:cli"
wolfharness = "wolfharness_cli.__main__:cli"
wolfharness-db = "wolfharness_storage.sql_provider.cli:main"

[project.entry-points."fsspec.specs"]
acp = "acp.filesystem:ACPFileSystem"

[project.entry-points."jinjarope.environment"]
wolfharness = "wolfharness.utils:setup_env"

[project.entry-points."universal_pathlib.implementations"]
acp = "acp.filesystem:ACPPath"

[project.entry-points."wolfharness.capabilities"]
mcp = "wolfharness.capabilities.mcp_server_cap:McpServerCap"
function_tools = "wolfharness.capabilities.function_toolset:FunctionToolsetCapability"
subagent = "wolfharness.capabilities.subagent_capability:SubagentCapability"
skill = "wolfharness.capabilities.skill_manager_cap:SkillManagerCap"
combined = "wolfharness.capabilities.combined_toolset:CombinedToolsetCapability"
code_mode = "wolfharness.capabilities.code_mode_capability:CodeModeCapability"
tool_display = "wolfharness.capabilities.tool_display_capability:ToolDisplayCapability"
question = "wolfharness.capabilities.question:QuestionCapability"
background_task = "wolfharness.capabilities.background_task:BackgroundTaskCapability"

[project.optional-dependencies]
a2a = ["fasta2a", "starlette"]  # A2A Server
bot = [
  "python-telegram-bot[socks]>=21.0",
  "slack-sdk>=3.26.0",
  "slackify-markdown>=0.2.0",
  "croniter>=2.0.0",
]  # Chat channel integrations (Telegram, Slack, Discord, etc.)
braintrust = ["braintrust", "autoevals"]  # Braintrust Prompt Hub
clipboard = ["copykitten"]  # Clipboard functionality
coding = [
  "rustworkx>=0.17.1",
  "grep-ast",
  "ast-grep-py>=0.40.0",
  "tree-sitter>=0.25.2",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-c>=0.24.1",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter>=0.25.2",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-cpp>=0.23.0",
  "tree-sitter-rust>=0.23.0",
  "tree-sitter-go>=0.23.0",
  "tree-sitter-json>=0.24.0",
  "tree-sitter-yaml>=0.6.0",
]  # Packages to allow coding functionality
composio = ["composio"]  # Composio toolsets
events = ["evented[all]"]  # Event triggers for agents
# git = ["fsspec[git]"]  # Git support (disabled: cffi doesn't support free-threaded 3.13)
langfuse = ["langfuse"]  # Langfuse Prompt Hub
markitdown = [
  "markitdown; python_version < '3.14'"
]  # MarkItDown Media Converter
mcp-discovery = [
  "fastembed>=0.7.4; python_version < '3.14'",
  "lancedb>=0.26.0; python_version < '3.14'",
  "pyarrow>=19.0.0; python_version < '3.14'",
]  # MCP Discovery Toolset with semantic search
mcp_run = ["mcpx-py>=0.7.0"]  # MCP.run Toolset
notifications = ["apprise>=1.9.5"]  # Notification Toolset
promptlayer = ["promptlayer"]  # PromptLayer Prompt Hub
tiktoken = ["tiktoken"]  # Exact token counting
tts = [
  "anyvoice[tts-edge,openai]>=0.0.2"
]  # Text-to-Speech using AnyVoice (disabled: cffi doesn't support free-threaded 3.13)
viking = [
  "openviking-sdk>=0.1.6"
]  # Viking storage & retrieval capability (download_bytes for image vision)
watchdog = ["watchdog>=4.0.0"]  # Filesystem watcher for skill hot-reload
zed = ["zstandard>=0.23.0"]  # Zed IDE storage provider

[dependency-groups]
dev = [
  "check-jsonschema>=0.35.0",
  "devtools",
  "dirty-equals>=0.9.0",
  "fastembed>=0.7.4; python_version < '3.14'",
  "import-linter>=2.12",
  "inline-snapshot>=0.13.0",
  "lancedb>=0.26.0; python_version < '3.14'",
  "openapi_spec_validator",
  "pyinstaller>=6.17.0",
  "pyreadline3",
  "pytest",
  # Only add below (Copier)
  "pytest-asyncio>=0.24.0",
  "pytest-cov",
  # "pytest-pretty>=1.3.0",
  "pytest-recording>=0.13.0",
  "pytest-rerunfailures>=16.1",
  "pytest-timeout>=2.4.0",
  "pytest-xdist",
  "syrupy>=4.0.0",
  "vcrpy>=7.0.0",
]
benchmark = ["pyinstrument"]
docs = [
  "beautifulsoup4>=4.14.3",
  "json-schema-for-humans>=1.0.0",
  "mkdocs-material",
  "mknodes",
  # Only add below (Copier)
  "zensical>=0.0.51",
]
lint = [
  "mypy[faster-cache]",
  "ruff",
  "ty",
  "types-PyYAML",
  "types-Pygments",
  "types-croniter",
  "types-jsonschema>=4.25.1.20251009",
  # Only add below (Copier)
]

[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError",
  'if __name__ == "__main__":',
]
show_missing = true
skip_covered = true

[tool.importlinter]
root_packages = [
  "wolfharness",
  "wolfharness_config",
  "wolfharness_server",
  "wolfharness_toolsets",
  "wolfharness_storage",
  "wolfharness_cli",
  "wolfharness_commands",
  "wolfharness_prompts",
  "acp",
]

[[tool.importlinter.contracts]]
name = "Server must not import from core app logic"
type = "forbidden"
source_modules = ["wolfharness_server"]
forbidden_modules = ["wolfharness_commands", "wolfharness_cli"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Config must not import from core"
type = "forbidden"
source_modules = ["wolfharness_config"]
forbidden_modules = [
  "wolfharness",
  "wolfharness_server",
  "wolfharness_toolsets",
  "wolfharness_storage",
  "wolfharness_commands",
  "wolfharness_cli"
]
# Pre-existing direct violations are listed in ignore_imports; remove entries
# as imports are fixed during Phase 7 refactoring. Indirect violations are
# excluded via allow_indirect_imports until the config→core dependency chains
# are untangled (see OpenSpec thin-wrapper-refactor Phase 7 tasks).
allow_indirect_imports = true
ignore_imports = [
  "wolfharness_config.wolfharness_tools -> wolfharness.prompts.conversion_manager",
  "wolfharness_config.wolfharness_tools -> wolfharness.tool_impls.agent_cli",
