[[tool.importlinter.contracts]]
name = "ACP package must not import from server"
type = "forbidden"
source_modules = ["acp"]
forbidden_modules = [
  "wolfharness_server",
  "wolfharness_commands",
  "wolfharness_cli"
]
# No direct violations exist; all violations are indirect (acp -> wolfharness.utils
# -> ... -> server). Indirect checks are disabled via allow_indirect_imports
# until the downstream wolfharness.common_types -> wolfharness_server chain is fixed
# (see OpenSpec thin-wrapper-refactor Phase 7 tasks).
allow_indirect_imports = true

# [tool.uv.sources]
# exxec = { path = "../exxec", editable = true }
# schemez = { path = "../schemez", editable = true }

[tool.logfire]
ignore_no_config = true

[tool.mknodes]
allowed-commit-types = [
  "fix",
  "feat",
  "refactor",
  "docs",
  "test",
  "build",
  "chore",
]
docstring-style = "google"

[tool.mypy]
python_version = "3.13"
pretty = true
strict = true
check_untyped_defs = true
exclude = ["venv/", ".venv/"]
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
# warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["fsspec.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "grep_ast",
  "grep_ast.parsers",
  "grep_ast.tsl",
  "tree_sitter",
  "tree_sitter_language_pack",
  "rustworkx",
  "zstandard",
  "telegram",
  "telegram.ext",
  "telegram.request",
  "telegram._files._basemedium",
  "slack_sdk.socket_mode.response",
  "slack_sdk.socket_mode.websockets",
  "slack_sdk.socket_mode.request",
  "slack_sdk.web.async_client",
  "slackify_markdown",
  "copykitten",
  "promptlayer",
  "langfuse",
  "langfuse.api.client",
  "braintrust",
  "composio",
  "ast_grep_py",
  "fasta2a",
  "fasta2a.applications",
  "fasta2a.broker",
  "fasta2a.schema",
  "fasta2a.storage",
  "fasta2a.worker",
  "mcp_run",
  "pyarrow.parquet",
  "anyvoice",
  "clawd_code_sdk.models",
  "fastmcp.prompts.prompt",
  "fastmcp.prompts.function_prompt",
  "fastmcp.tools.tool",
  "apprise",
  "openviking_sdk",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "wolfharness_bot.channels.telegram",
  "wolfharness_bot.channels.slack",
  "wolfharness_toolsets.composio_toolset",
  "wolfharness_prompts.langfuse_hub",
  "wolfharness_prompts.braintrust_hub",
]
disable_error_code = [
  "type-arg",
  "arg-type",
  "no-untyped-call",
  "attr-defined",
  "union-attr",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "basic"
deprecateTypingAliases = true
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnknownVariableType = false
reportAny = false
reportImplicitOverride = false
reportUnusedFunction = false
reportImplicitStringConcatenation = false
reportIgnoreCommentWithoutRule = false
reportUnannotatedClassAttribute = false
reportSelfClsParameterName = false
reportPrivateImportUsage = false
reportUnusedExpression = false

[tool.pytest]
addopts = [
  "-m",
  "not slow and not snapshot and not e2e and not real_model and not real_mcp"
]
filterwarnings = [
  "ignore::DeprecationWarning:psygnal.*",
  "ignore::DeprecationWarning:pydantic.*:",
  "ignore::DeprecationWarning:typer.*",
]
log_cli = true
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_level = "ERROR"
markers = [
  "asyncio: mark test as async",
  "e2e: marks tests as subprocess end-to-end tests (excluded by default, run nightly)",
  "flaky: marks tests as flaky (auto-rerun on failure)",
  "incompatible_with_thinking: marks tests that use structured output (tool_choice: required) which is incompatible with thinking-mode models (DeepSeek, Kimi) — see issue #84",
  "integration: marks tests as integration tests",
  "isolated: test requires fresh server (bypasses subprocess cache)",
  "known_bug: Test that reproduces a known bug (xfail until fixed)",
  "real_mcp: marks tests that use real MCPToolset connections (skips __aenter__/__aexit__ mock fixture)",
  "real_model: marks tests that make real model API calls (auto-skipped without OPENAI_API_KEY, replaces requires_openai_key)",
  "security: security-related tests",
  "slow: marks tests as slow",
  "snapshot: marks tests as syrupy snapshot tests (excluded by default, renamed from acp_snapshot)",
  "unit: marks tests as unit tests",
  "vcr: marks tests as VCR cassette replay tests",
]
minversion = "9.0"
python_files = ["test_*.py"]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = "180"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.uv]
default-groups = ["dev", "lint", "docs"]
constraint-dependencies = ["extism-sys<1.13.0"]

# Override mknodes metadata: it declares a dependency on the legacy `agentpool`
# PyPI package, which pulls in outdated code that conflicts with the renamed
# `wolfharness` project. Redirect that dependency to `wolfharness` so uv resolves
# the local workspace instead of downloading the stale PyPI release.
[[tool.uv.dependency-metadata]]
name = "mknodes"
version = "2.2.14"
requires-dist = [
  "wolfharness",
  "anybadge",
  "anyenv[httpx]",
  "clinspector",
  "coloraide",
  "epregistry",
  "fieldz",
  "fsspec",
  "git-changelog",
  "githarbor",
  "gitpython",
  "griffelib",
  "jinja2",
  "jinjarope[icons]",
  "mkdocstrings[python]",
  "natsort",
  "pipdeptree",
  "pydantic",
  "pytest-asyncio",
  "python-dotenv",
  "setuptools",
  "tomli-w",
  "typer",
  "universal-pathlib",
  "upathtools[httpx]",
  "yamling",
  "zensical",
]

[tool.uv.build-backend]
module-name = [
  "wolfharness",
  "wolfharness_config",
  "wolfharness_cli",
  "wolfharness_commands",
  "wolfharness_storage",
  "wolfharness_prompts",
  "wolfharness_server",
  "wolfharness_toolsets",
  "acp",
]
wheel-exclude = [
  ".mypy_cache/**",
  "__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".pytest_cache/**",
  ".ruff_cache/**",
]
source-exclude = [
  ".mypy_cache/**",
  "__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".pytest_cache/**",
  ".ruff_cache/**",
]
