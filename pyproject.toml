  "wolfharness_config.wolfharness_tools -> wolfharness.tools.base",
  "wolfharness_config.compaction -> wolfharness.messaging.compaction",
  "wolfharness_config.conditions -> wolfharness.talk.registry",
  "wolfharness_config.conditions -> wolfharness.utils.inspection",
  "wolfharness_config.conditions -> wolfharness.utils.time_utils",
  "wolfharness_config.durable -> wolfharness.utils.parse_time",
  "wolfharness_config.event_handlers -> wolfharness.agents.events",
  "wolfharness_config.event_handlers -> wolfharness.agents.events.builtin_handlers",
  "wolfharness_config.event_handlers -> wolfharness.agents.events.tts_handlers",
  "wolfharness_config.event_handlers -> wolfharness.common_types",
  "wolfharness_config.event_handlers -> wolfharness.utils.importing",
  "wolfharness_config.events -> wolfharness.messaging.events",
  "wolfharness_config.forward_targets -> wolfharness",
  "wolfharness_config.forward_targets -> wolfharness.messaging",
  "wolfharness_config.forward_targets -> wolfharness.utils.inspection",
  "wolfharness_config.forward_targets -> wolfharness.utils.model_helpers",
  "wolfharness_config.forward_targets -> wolfharness.utils.time_utils",
  "wolfharness_config.hooks -> wolfharness.hooks",
