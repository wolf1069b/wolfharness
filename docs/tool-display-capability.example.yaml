# ToolDisplayCapability 配置示例
#
# 全局装饰器:不改子能力源码,对 agent 已装配工具改名 + 注入 diff/rich 富信息事件。
# 五个正交开关:rename_mode(改名)/ emit_diff(diff 注入)/ emit_diff_for(diff 白名单)/
# emit_rich(rich 展示)/ emit_rich_for(rich 白名单)。
# 详见 docs/explanation/tool-display-capability.md
---
# 示例 1:OpenCode TUI —— 改名命中客户端渲染白名单 + diff/rich 注入
#   viking_write/viking_edit 重命名为 write/edit,客户端按白名单渲染 diff;
#   viking_read/search 重命名为 read/grep,并按 emit_rich 注入 rich 展示事件。
agents:
  wiki-librarian-opencode:
    model:
      identifier: anthropic:claude-sonnet-4-5
    capabilities:
      - type: viking
        mode: write
        url: http://localhost:8765
      - type: tool_display
        args:
          rename_mode: true
          name_map:
            viking_write: write
            viking_edit: edit
            viking_read: read
            viking_search: grep
          emit_diff: true
          emit_diff_for:
            - viking_write
            - viking_edit
          emit_rich: true
          emit_rich_for:
            - viking_read
            - viking_search
            - viking_find
            - viking_glob
---
# 示例 2:ACP (Zed) —— 展示原名 + diff/rich 注入
#   Zed 通过 FileEditToolCallContent 原生渲染差异、ToolCallStartEvent 渲染
#   kind/locations;无需改名,rename_mode: false。
agents:
  wiki-librarian-acp:
    model:
      identifier: anthropic:claude-sonnet-4-5
    capabilities:
      - type: viking
        mode: write
        url: http://localhost:8765
      - type: tool_display
        args:
          rename_mode: false
          emit_diff: true
          emit_diff_for:
            - viking_write
            - viking_edit
          emit_rich: true
          emit_rich_for:
            - viking_read
            - viking_search
            - viking_find
            - viking_glob
---
# 示例 3:子能力已自发射 —— 仅改名,关闭 diff 注入避免重复
#   fsspec 等工具集已在内部 emit DiffContentItem(见
#   src/wolfharness_toolsets/fsspec_toolset/toolset.py:575),装饰器只负责
#   改名,emit_diff: false。
#   注意:fsspec_read 不在内置 extractor 注册表中,emit_rich 只注入 start
#   事件(kind/locations),不含内容 —— 如需内容需自行注册 extractor。
agents:
  fs-writer:
    model:
      identifier: anthropic:claude-sonnet-4-5
    tools:
      - type: file_access
        root: /data
    capabilities:
      - type: tool_display
        args:
          rename_mode: true
          name_map:
            fsspec_write: write
            fsspec_edit: edit
            fsspec_read: read
          emit_diff: false
          emit_rich: true
          emit_rich_for:
            - fsspec_read